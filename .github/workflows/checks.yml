# Temporary benchmark: identical cold and warm port builds, isolated from shared caches.
name: port cache measurement
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENRAC_BUILD_JOBS: all
  CCACHE_COMPILERCHECK: content
concurrency:
  group: port-cache-measurement
  cancel-in-progress: false
jobs:
  port:
    name: port cold
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Each key's prefix is no other job's: "checks-port" was the start of every other port
      # job's key, and restored their objects, built with other options, when it had none.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: checks-port-release-audit-f378c6371
          verbose: 1
          save: ${{ github.event_name != 'pull_request' }}
          max-size: 1G
      - uses: ./.github/actions/mesa-cache
        with:
          variant: ubuntu-release-audit-f378c6371
      - name: Compilers and SDL's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            mesa-vulkan-drivers vulkan-validationlayers

      - uses: ./.github/actions/port-build-cache
        with:
          variant: ubuntu-compatibility-audit-f378c6371
          preset: release

      - name: hostgen and build cache regressions
        run: |
          python -m unittest discover -s port/tools/hostgen -v
          # This job installs both Clang and ccache, so the real cache fixture runs here.
          python -m unittest discover -s tools -p test_ci_cache.py -v

      - name: Build
        working-directory: port
        run: |
          cmake --preset release -DOPENRAC_ENHANCED_RENDERING=OFF -DOPENRAC_PROBE_BAKER=OFF
          cmake --build --preset release

      - name: Verify compatibility build configuration
        working-directory: port
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          cache = pathlib.Path('build/release/CMakeCache.txt').read_text().splitlines()
          assert 'OPENRAC_ENHANCED_RENDERING:BOOL=OFF' in cache
          assert 'OPENRAC_PROBE_BAKER:BOOL=OFF' in cache
          tests = json.loads(subprocess.check_output(
              ['ctest', '--preset', 'release', '--show-only=json-v1']))['tests']
          names = {test['name'] for test in tests}
          enhanced = {'gtao_vulkan', 'probe_gpu_vulkan', 'early_lighting_vulkan',
                      'hero_shadow_vulkan', 'sun_shadow_vulkan', 'shadow_scroll_vulkan',
                      'fsr3_frame', 'probe_bake'}
          assert not names & enhanced, names & enhanced
          PY

      - name: Tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ctest --preset release --parallel 2 --stop-on-failure

  port-warm:
    name: port warm
    needs: port
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Each key's prefix is no other job's: "checks-port" was the start of every other port
      # job's key, and restored their objects, built with other options, when it had none.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: checks-port-release-audit-f378c6371
          verbose: 1
          save: ${{ github.event_name != 'pull_request' }}
          max-size: 1G
      - uses: ./.github/actions/mesa-cache
        with:
          variant: ubuntu-release-audit-f378c6371
      - name: Compilers and SDL's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            mesa-vulkan-drivers vulkan-validationlayers

      - uses: ./.github/actions/port-build-cache
        with:
          variant: ubuntu-compatibility-audit-f378c6371
          preset: release

      - name: hostgen and build cache regressions
        run: |
          python -m unittest discover -s port/tools/hostgen -v
          # This job installs both Clang and ccache, so the real cache fixture runs here.
          python -m unittest discover -s tools -p test_ci_cache.py -v

      - name: Build
        working-directory: port
        run: |
          cmake --preset release -DOPENRAC_ENHANCED_RENDERING=OFF -DOPENRAC_PROBE_BAKER=OFF
          cmake --build --preset release

      - name: Verify compatibility build configuration
        working-directory: port
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          cache = pathlib.Path('build/release/CMakeCache.txt').read_text().splitlines()
          assert 'OPENRAC_ENHANCED_RENDERING:BOOL=OFF' in cache
          assert 'OPENRAC_PROBE_BAKER:BOOL=OFF' in cache
          tests = json.loads(subprocess.check_output(
              ['ctest', '--preset', 'release', '--show-only=json-v1']))['tests']
          names = {test['name'] for test in tests}
          enhanced = {'gtao_vulkan', 'probe_gpu_vulkan', 'early_lighting_vulkan',
                      'hero_shadow_vulkan', 'sun_shadow_vulkan', 'shadow_scroll_vulkan',
                      'fsr3_frame', 'probe_bake'}
          assert not names & enhanced, names & enhanced
          PY

      - name: Tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ctest --preset release --parallel 2 --stop-on-failure
